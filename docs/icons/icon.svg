<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="felt" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#2aa04c"/>
      <stop offset="0.55" stop-color="#1a8a3f"/>
      <stop offset="1" stop-color="#0f6b2e"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0272f"/>
      <stop offset="1" stop-color="#7d1419"/>
    </linearGradient>
    <pattern id="lattice" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="34" height="34" fill="none"/>
      <rect width="7" height="34" fill="#ffffff" fill-opacity="0.13"/>
      <rect width="34" height="7" fill="#ffffff" fill-opacity="0.13"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#felt)"/>

  <!-- card back, behind -->
  <g transform="rotate(-12 512 512)" filter="url(#shadow)">
    <rect x="250" y="200" width="420" height="588" rx="40" fill="url(#back)" stroke="#5e0f13" stroke-width="6"/>
    <rect x="250" y="200" width="420" height="588" rx="40" fill="url(#lattice)"/>
    <!-- spider (drawn from scratch) -->
    <g transform="translate(372 372) scale(0.72)" stroke="#2a0507" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M-30 -20 L-95 -80 L-125 -40"/>
      <path d="M-34 -2 L-115 -30 L-150 20"/>
      <path d="M-32 16 L-110 40 L-135 100"/>
      <path d="M-26 32 L-80 90 L-90 150"/>
      <path d="M30 -20 L95 -80 L125 -40"/>
      <path d="M34 -2 L115 -30 L150 20"/>
      <path d="M32 16 L110 40 L135 100"/>
      <path d="M26 32 L80 90 L90 150"/>
      <ellipse cx="0" cy="-40" rx="26" ry="24" fill="#2a0507" stroke="none"/>
      <ellipse cx="0" cy="22" rx="44" ry="58" fill="#2a0507" stroke="none"/>
    </g>
  </g>

  <!-- ace of spades, in front -->
  <g transform="rotate(8 600 560)" filter="url(#shadow)">
    <rect x="400" y="268" width="420" height="588" rx="40" fill="#ffffff" stroke="#00000033" stroke-width="5"/>
    <text x="446" y="388" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="120" fill="#111111">A</text>
    <path transform="translate(735 330) scale(0.62)" d="M0 -60 C 30 -20 80 0 80 40 C 80 75 45 90 15 70 C 20 90 28 105 40 115 L -40 115 C -28 105 -20 90 -15 70 C -45 90 -80 75 -80 40 C -80 0 -30 -20 0 -60 Z" fill="#111111"/>
    <path transform="translate(610 600) scale(1.75)" d="M0 -60 C 30 -20 80 0 80 40 C 80 75 45 90 15 70 C 20 90 28 105 40 115 L -40 115 C -28 105 -20 90 -15 70 C -45 90 -80 75 -80 40 C -80 0 -30 -20 0 -60 Z" fill="#111111"/>
  </g>
</svg>
