[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-safe-mcp"
version = "0.1.0"
description = "A safety-focused Gmail MCP server for previewing and trashing selected messages"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1,<4",
  "github-copilot-sdk>=1.0,<2",
  "gunicorn>=23,<24",
  "google-api-python-client>=2.0,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
  "kiwipiepy>=0.23,<1",
  "mcp>=2,<3",
  "pypdfium2>=4.30,<6",
  "rank-bm25>=0.2,<1",
]

[project.scripts]
gmail-safe-mcp = "gmail_safe_mcp.server:main"
gmail-safe-web = "gmail_safe_mcp.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_safe_mcp"]
