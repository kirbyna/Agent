<!doctype html>
<html lang="ko" data-base-path="{{ request.script_root }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gmail Safe{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('gmail_page') }}" aria-label="KT 비정형데이터 자산화 Agent 홈">
        <img class="brand-mark" src="{{ url_for('static', filename='kt-logo.png') }}" alt="KT">
        <span>비정형데이터 자산화 Agent</span>
      </a>
      <nav aria-label="주 메뉴">
        <a class="nav-link {% if request.endpoint == 'documents_page' %}active{% endif %}" href="{{ url_for('documents_page') }}">문서 추출</a>
        <a class="nav-link {% if request.endpoint == 'document_search_page' %}active{% endif %}" href="{{ url_for('document_search_page') }}">문서 검색</a>
        <a class="nav-link {% if request.endpoint == 'agents_page' %}active{% endif %}" href="{{ url_for('agents_page') }}">Agent 관리</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</html>
